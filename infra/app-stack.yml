# Deployed by CI on every push to main:
#   IMAGE_TAG=<sha> docker stack deploy -c infra/app-stack.yml --with-registry-auth pokoena
# Traefik itself lives in a separate stack (infra/traefik/traefik-stack.yml) and is
# never touched by this file's redeploys.
#
# worker + redis are deliberately NOT deployed yet: the production droplet is a 1GB/1vCPU
# box and nothing in Phase 1 enqueues a Celery task, so running an idle worker + broker
# there would just compete for memory. Re-add them (see git history / infra/README.md)
# once Phase 2's async analysis jobs need them, ideally alongside a droplet resize.
# The internal-only "pokoena-internal" network goes with them — with no redis/worker
# to talk to, backend has no need for a second, non-internet-routed network right now.

version: "3.9"

networks:
  traefik-public:
    external: true

secrets:
  # NOT db_url — that secret holds the doadmin superuser DSN, used only by the
  # one-shot migration job in deploy.yml. A superuser always bypasses RLS, so
  # the running backend service must connect as the unprivileged poko_app
  # role instead, or every RLS policy silently never applies.
  db_url_app:
    external: true
  db_url_bypass:
    external: true
  jwt_secret:
    external: true

services:
  frontend:
    image: ghcr.io/naimakin/pokoena-frontend:${IMAGE_TAG:-latest}
    # middleware.ts runs in Next.js's Edge runtime, which has no `fs` access even
    # when self-hosted — it can only read plain process.env, not a secrets file.
    # So unlike the backend's *_FILE indirection, the secret is read from its
    # mounted file once here, at container start, and exported as a plain env
    # var before the Node process (and therefore middleware) ever sees it.
    # `$$` (not `$`) is required: docker stack deploy runs Compose variable
    # interpolation over this file first, and `$(...)` is not valid interpolation
    # syntax, so an unescaped `$` fails the whole deploy with "invalid
    # interpolation format". `$$` is the escape for a literal `$` — the container's
    # shell receives `$(cat /run/secrets/jwt_secret)` exactly as written here.
    command: ["sh", "-c", "export JWT_SECRET=\"$$(cat /run/secrets/jwt_secret)\"; exec node server.js"]
    environment:
      NODE_ENV: production
    secrets: [jwt_secret]
    networks: [traefik-public]
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0
      rollback_config: { parallelism: 1, order: stop-first }
      restart_policy: { condition: on-failure, delay: 5s, max_attempts: 3, window: 120s }
      resources:
        limits: { cpus: "0.5", memory: 384M }
        reservations: { cpus: "0.1", memory: 128M }
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`pokoena.com`) || Host(`www.pokoena.com`)"
        - "traefik.http.routers.frontend.entrypoints=websecure"
        - "traefik.http.routers.frontend.tls.certresolver=cfdns"
        - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  backend:
    image: ghcr.io/naimakin/pokoena-backend:${IMAGE_TAG:-latest}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENV: production
      DATABASE_URL_FILE: /run/secrets/db_url_app
      DATABASE_URL_BYPASS_FILE: /run/secrets/db_url_bypass
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CORS_ORIGINS: "https://pokoena.com,https://www.pokoena.com"
      COOKIE_DOMAIN: ".pokoena.com"
    secrets: [db_url_app, db_url_bypass, jwt_secret]
    networks: [traefik-public]
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0
      rollback_config: { parallelism: 1, order: stop-first }
      restart_policy: { condition: on-failure, delay: 5s, max_attempts: 3, window: 120s }
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.2", memory: 200M }
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.backend.rule=Host(`api.pokoena.com`)"
        - "traefik.http.routers.backend.entrypoints=websecure"
        - "traefik.http.routers.backend.tls.certresolver=cfdns"
        - "traefik.http.services.backend.loadbalancer.server.port=8000"
