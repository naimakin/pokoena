# Deployed once, by hand, on the droplet — NOT touched by CI:
#   docker stack deploy -c infra/traefik/traefik-stack.yml traefik
# Redeploy manually only when Traefik's own config changes.

version: "3.9"

networks:
  traefik-public:
    external: true

volumes:
  traefik_certs:
  docker_proxy_sock:

configs:
  docker_proxy_conf:
    file: ./docker-proxy.conf

secrets:
  cf_api_token:
    external: true
  traefik_dashboard_htpasswd:
    external: true

services:
  # Traefik's bundled Docker client hardcodes API version 1.24 and ignores both
  # version negotiation and DOCKER_API_VERSION for the swarm provider — recent
  # Docker Engine (here: 29.x / API 1.52) rejects that outright. This sidecar
  # strips the /vX.YY prefix from requests so the daemon falls back to its own
  # default version. It's reachable only via a Unix socket on a shared volume,
  # never on any network, so nothing else in the stack can reach the Docker API
  # through it.
  docker-proxy:
    image: nginx:alpine
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - docker_proxy_sock:/proxy
    configs:
      # Replaces the whole nginx.conf (not just conf.d/) — it needs `user root;`
      # at the top level, and nginx rejects a duplicate `user` directive if one
      # is added on top of the base image's default nginx.conf instead.
      - source: docker_proxy_conf
        target: /etc/nginx/nginx.conf
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      resources:
        limits: { cpus: "0.1", memory: 32M }

  traefik:
    image: traefik:v3.5
    command:
      - "--providers.swarm.endpoint=unix:///proxy/docker-proxy.sock"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=traefik-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.cfdns.acme.dnschallenge=true"
      - "--certificatesresolvers.cfdns.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cfdns.acme.email=nakn36@gmail.com"
      - "--certificatesresolvers.cfdns.acme.storage=/certs/acme.json"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_api_token
    secrets:
      - cf_api_token
      - traefik_dashboard_htpasswd
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - docker_proxy_sock:/proxy
      - "traefik_certs:/certs"
    networks:
      - traefik-public
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        # Even with a router pinned to service=api@internal, the swarm provider
        # still tries to build its own implicit default service for this
        # container (logged as service "traefik-traefik") and errors on it for
        # lack of a port — which was silently blocking this whole container's
        # label set, including the dashboard router's cert request below.
        - "traefik.http.services.traefik-traefik.loadbalancer.server.port=8080"
        - "traefik.http.routers.dashboard.rule=Host(`traefik.pokoena.com`)"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.tls.certresolver=cfdns"
        - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
        - "traefik.http.middlewares.dashboard-auth.basicauth.usersfile=/run/secrets/traefik_dashboard_htpasswd"
