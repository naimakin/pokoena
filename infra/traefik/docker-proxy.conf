# Full nginx.conf (replaces the base image's, not just conf.d/) for the
# docker-proxy sidecar in traefik-stack.yml.
#
# Traefik's bundled Docker client hardcodes API version 1.24 and does not
# negotiate or respect DOCKER_API_VERSION — recent Docker Engine releases
# (here: 29.x / API 1.52) reject anything below 1.44 outright. This strips
# the /vX.YY prefix from requests so the daemon falls back to its own
# default (latest) API version instead of rejecting the stale one Traefik sends.
#
# `user root;` because nginx:alpine's worker processes default to the
# unprivileged "nginx" user, which can't open /var/run/docker.sock
# (root:docker, mode 660). Reachable only via a shared Unix socket volume,
# never published on any network, so nothing else in the stack can reach it.

user root;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    upstream docker_socket {
        server unix:/var/run/docker.sock;
    }

    server {
        listen unix:/proxy/docker-proxy.sock;

        location ~ ^/v[0-9]+\.[0-9]+(/.*)$ {
            rewrite ^/v[0-9]+\.[0-9]+(/.*)$ $1 break;
            proxy_pass http://docker_socket;
        }

        location / {
            proxy_pass http://docker_socket;
        }
    }
}
