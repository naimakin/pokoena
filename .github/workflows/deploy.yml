name: Deploy

on:
  push:
    branches: [main]
  # Manual re-run from the Actions tab. A deploy can fail for a reason that
  # lives on the server rather than in the commit (a missing Swarm secret, for
  # one), and without this there's no way to retry once that's fixed short of
  # pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/naimakin/pokoena-backend:${{ steps.vars.outputs.tag }}
            ghcr.io/naimakin/pokoena-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.pokoena.com
          tags: |
            ghcr.io/naimakin/pokoena-frontend:${{ steps.vars.outputs.tag }}
            ghcr.io/naimakin/pokoena-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}
      - name: Trust droplet host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DO_SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Login to ghcr (for --with-registry-auth forwarding)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run database migrations (one-shot swarm job)
        env:
          DOCKER_HOST: ssh://${{ secrets.DO_SSH_USER }}@${{ secrets.DO_SSH_HOST }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          JOB="pokoena-migrate-${{ github.run_id }}"
          # traefik-public purely for internet egress to the managed Postgres host —
          # this job publishes nothing and carries no traefik labels.
          #
          # Migrations need a role that can CREATE in schema public. That used
          # to be db_url, back when it held the schema-owning account — but
          # db_url now points at poko_app, the RLS-bound application role, which
          # has no DDL rights at all. The first migration attempted after that
          # change failed with "permission denied for schema public", and it
          # failed silently in the sense that nothing had needed a migration in
          # between, so the breakage sat unnoticed.
          #
          # So the migration role is its own secret. Granting CREATE to poko_app
          # instead would hand the role every request runs under the right to
          # reshape the schema, which is exactly the privilege separation
          # db_url_app / db_url_bypass exist to maintain — see infra/README.md.
          # Falls back to db_url so this stays a no-op until the secret exists —
          # a deploy that has no migration to run must not start failing over a
          # secret it never needed.
          MIGRATE_SECRET=db_url_migrate
          if ! docker secret ls --format '{{.Name}}' | grep -qx "$MIGRATE_SECRET"; then
            MIGRATE_SECRET=db_url
            echo "::warning::Swarm secret 'db_url_migrate' does not exist, falling back to 'db_url'."
            echo "db_url holds a poko_app DSN, which cannot issue DDL, so any migration that"
            echo "actually has work to do will fail with 'permission denied for schema public'."
            echo "Fix, on the droplet, with the schema owner's connection string:"
            echo "  printf %s '<doadmin connection string>' | docker secret create db_url_migrate -"
          fi
          # --detach is required, not cosmetic: this is a one-shot task
          # (--restart-condition none) that exits the moment alembic finishes,
          # and the CLI's convergence progress bar only ever accepts a task that
          # stays *running* as converged. Without it, `docker service create`
          # spins on "overall progress: 0 out of 1 tasks" until the step times
          # out and the polling loop below never even starts.
          docker service create --detach \
            --name "$JOB" \
            --network traefik-public \
            --secret "$MIGRATE_SECRET" \
            --env "DATABASE_URL_MIGRATE_FILE=/run/secrets/$MIGRATE_SECRET" \
            --restart-condition none \
            --with-registry-auth \
            "ghcr.io/naimakin/pokoena-backend:${IMAGE_TAG}" \
            alembic upgrade head

          # No desired-state filter: the task is still *running* for most of this
          # loop, and the old filter (desired-state=shutdown) matched nothing
          # until it had already stopped.
          STATE=""
          for _ in $(seq 1 60); do
            STATE=$(docker service ps --format '{{.CurrentState}}' "$JOB" 2>/dev/null | head -n1 || true)
            echo "migration state: ${STATE:-<pending>}"
            case "$STATE" in
              Complete*|Failed*|Rejected*|Orphaned*) break ;;
            esac
            sleep 2
          done

          docker service logs "$JOB" || true
          # A task Swarm Rejected never started, so it has no logs — the reason
          # (image pull failure, no space left on device, ...) is only in the
          # task's Error field. Print it, plus disk usage, before removing it.
          case "$STATE" in
            Complete*) ;;
            *)
              echo "task error(s):"
              docker service ps --no-trunc --format '{{.CurrentState}} | {{.Error}}' "$JOB" || true
              docker system df || true
              ;;
          esac
          docker service rm "$JOB"

          # Fail loudly. Previously any non-Complete outcome (including a failed
          # migration) fell straight through to the stack deploy below, which
          # then shipped application code against an un-migrated schema.
          case "$STATE" in
            Complete*) echo "Migration completed." ;;
            *) echo "::error::Migration did not complete (last state: ${STATE:-unknown})"; exit 1 ;;
          esac
      - name: Deploy app stack
        env:
          DOCKER_HOST: ssh://${{ secrets.DO_SSH_USER }}@${{ secrets.DO_SSH_HOST }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          # --detach=false so the step waits for the services to actually
          # converge and fails if they don't. Detached (the CLI default), this
          # returns 0 the instant the spec is accepted — so a new container that
          # crashes and gets rolled back by update_config's failure_action still
          # reported a green deploy while production kept running the old image.
          docker stack deploy \
            -c infra/app-stack.yml \
            --with-registry-auth \
            --detach=false \
            pokoena
